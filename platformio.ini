; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; Flash: 16MB QD, PSRAM: 8MB OT
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug


; [env:adafruit_feather_esp32_v2]

; platform = espressif32
; board = adafruit_feather_esp32_v2
; board_upload.flash_size=8MB
; board_upload.maximum_size=8388608
; board_build.mcu = esp32
; board_build.f_cpu = 240000000L
; framework = arduino, espidf
; monitor_speed = 115200
; board_build.partitions = partitions_custom.csv
custom_component_remove =
	espressif/esp_insights 	
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp_rainmaker
	espressif/esp-sr                      
	espressif/esp-modbus
	espressif/esp32-camera
	espressif/network_provisioning

lib_archive = no
lib_deps = 
	earlephilhower/ESP8266Audio@2.0.0
	fastled/FastLED@3.10.1
	adafruit/Adafruit PN532@1.3.4
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.6.1
	ESP32Async/AsyncTCP

build_flags = 
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DCONFIG_ASYNC_TCP_PRIORITY=23
	-DCONFIG_ASYNC_TCP_USE_WDT=1
	; Enable USB CDC for Serial.print() support over USB
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

# Optimization and linker flags to reduce IRAM usage

; Bare-minimum deep-sleep floor probe: flash with `pio run -e sleepprobe -t upload`.
; -DSLEEP_PROBE_BUILD swaps main.cpp's app out for sleepprobe_main.cpp (immediate deep
; sleep, nothing initialized) to separate board-level sleep drain from app-level sleep
; drain. Wake = BTN1 (GPIO12).
; [env:sleepprobe]
; extends = env:esp32-s3-devkitc-1
; build_flags =
;     ${env:esp32-s3-devkitc-1.build_flags}
;     -DSLEEP_PROBE_BUILD

