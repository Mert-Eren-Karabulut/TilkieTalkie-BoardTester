; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; ESP32-S3-WROOM-1 N16R8: 16 MB QIO flash, 8 MB octal PSRAM. See README.md and docs/RELEASE.md.
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug


; [env:adafruit_feather_esp32_v2]

; platform = espressif32
; board = adafruit_feather_esp32_v2
; board_upload.flash_size=8MB
; board_upload.maximum_size=8388608
; board_build.mcu = esp32
; board_build.f_cpu = 240000000L
; framework = arduino, espidf
; monitor_speed = 115200
; board_build.partitions = partitions_custom.csv
custom_component_remove =
	espressif/esp_insights 	
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp_rainmaker
	espressif/esp-sr                      
	espressif/esp-modbus
	espressif/esp32-camera
	espressif/network_provisioning

lib_archive = no
lib_deps = 
	earlephilhower/ESP8266Audio@2.0.0
	fastled/FastLED@3.10.1
	adafruit/Adafruit PN532@1.3.4
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.6.1
	ESP32Async/AsyncTCP

build_flags = 
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DCONFIG_ASYNC_TCP_PRIORITY=23
	-DCONFIG_ASYNC_TCP_USE_WDT=1
	; Enable USB CDC for Serial.print() support over USB
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Bench-only console commands (learning cycle, gauge data flash, endpoint set, factory, ...)
	; are compiled only with -DTT_BENCH: build/flash env:bench for a bench board. The
	; production image (this env) leaves them out. docs/CONSOLE.md lists both sets.

; Bench build: the production env plus the bench console commands (-DTT_BENCH).
; `pio run -e bench -t upload`. Shares the production sdkconfig, so the two images differ
; only in the console.
[env:bench]
extends = env:esp32-s3-devkitc-1
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTT_BENCH

; Bare-minimum deep-sleep floor probe: flash with `pio run -e sleepprobe -t upload`.
; -DSLEEP_PROBE_BUILD swaps main.cpp's app out for sleepprobe_main.cpp (immediate deep
; sleep, nothing initialized) to separate board-level sleep drain from app-level sleep
; drain. Wake = BTN1 (GPIO12).
; BLE controller probe: PLATFORMIO_BUILD_FLAGS="-DBLE_PROBE_BUILD" pio run -e esp32-s3-devkitc-1 -t upload
; (src/bleprobe_main.cpp: nimble_port_init with nothing else running; used to prove the btInUse fix).
; [env:sleepprobe]
; extends = env:esp32-s3-devkitc-1
; build_flags =
;     ${env:esp32-s3-devkitc-1.build_flags}
;     -DSLEEP_PROBE_BUILD

